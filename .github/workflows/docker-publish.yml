#este archivo permite ejecutar acciones de tabajo cuando se hace un push 

#para git flow, la configuración de este archivo 

name: Publicar imagen docker

on:
    push:
        branches:
            -main 

jobs:
    build-and-push:
        runs-on: :ubuntu-latest
        steps:
          - name: Descargar el codigo del repo
            uses:  actions/checkout@v4

          - name: Iniciar sesióndockers
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
          - name: Build and push
            uses: docker/build-push-action@v7
            with:
                context: .
                push: yes
                tags: ${{ secrets.DOCKER_USERNAME }}/ms-usuarios:latest
                        

   