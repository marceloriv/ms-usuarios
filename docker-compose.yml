services:
  mysql:
    image: mysql:8.4
    container_name: ms-usuarios-mysql
    restart: unless-stopped
    networks:
      - ticketti-network
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-usuarios_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - mysql_data_v2:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .    #el contedor va a buldear la imagen  del Dockerfile, que se encuentra en el directorio raíz del proyecto
    container_name: ms-usuarios
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ticketti-network

    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://host.docker.internal:8888
    ports:
      - "8080:8080"

      #volumes: para ocupar la configuración por defecto

volumes:
  mysql_data_v2:

networks:
  ticketti-network:
    external: true
    name: ticketti-network



