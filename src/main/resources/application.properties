
# Configuración general de la aplicación
spring.application.name=ms-usuarios

# Configuración de la base de datos MySQL (Docker publicado en localhost:3307)
spring.datasource.url=jdbc:mysql://localhost:3306/ms_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración para deshabilitar Eureka Client y Config Server 
spring.cloud.config.enabled=false

# Eureka Client Configuration para registro del microservicio en el servidor Eureka
eureka.client.enabled=false
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false



server.port=8080

