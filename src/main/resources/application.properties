
# Configuración general de la aplicación
spring.application.name=ms-usuarios

# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ms_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración para deshabilitar Eureka Client y Config Server 
spring.config.import=optional:configserver:

# Eureka Client Configuration para registro del microservicio en el servidor Eureka
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#eureka.instance.prefer-ip-address=true
eureka.client.enabled=false


server.port=8080